<h1>Таймер Онлайн</h1>
  <div id="display">00:00:00</div>

  <div class="controls">
    <label>Время (сек): </label>
    <input type="number" id="secondsInput" value="60" min="1">
    <button onclick="setTime()">Установить</button>
  </div>

  <div class="controls">
    <button onclick="startTimer()" id="startBtn">Старт</button>
    <button onclick="pauseTimer()" id="pauseBtn" disabled>Пауза</button>
    <button onclick="resetTimer()" class="stop">Сброс</button>
  </div>

  <script>
    let totalSeconds = 60;
    let remainingSeconds = 60;
    let intervalId = null;
    let isRunning = false;

    const displayEl = document.getElementById('display');
    const inputEl = document.getElementById('secondsInput');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    function formatTime(s) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function updateDisplay() {
      displayEl.textContent = formatTime(remainingSeconds);
    }

    // Устанавливает время из поля ввода, даже если таймер уже идёт
    function setTime() {
      const val = parseInt(inputEl.value, 10);
      if (isNaN(val) || val < 1) {
        alert('Введите число секунд больше 0');
        return;
      }

      totalSeconds = val;
      remainingSeconds = totalSeconds;
      updateDisplay();

      // Если таймер шёл — сбрасываем интервал и ставим на паузу
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        startBtn.disabled = false;
        pauseBtn.disabled = true;
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0 || isRunning) return;

      isRunning = true;
      startBtn.disabled = true;
      pauseBtn.disabled = false;

      intervalId = setInterval(() => {
        remainingSeconds--;
        updateDisplay();

        if (remainingSeconds <= 0) {
          remainingSeconds = 0;
          updateDisplay();
          clearInterval(intervalId);
          isRunning = false;
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          alert('Время вышло!');
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!isRunning) return;
      clearInterval(intervalId);
      isRunning = false;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    function resetTimer() {
      clearInterval(intervalId);
      isRunning = false;
      remainingSeconds = totalSeconds;
      updateDisplay();
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    updateDisplay(); // Показать начальное время
  </script>
